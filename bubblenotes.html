<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bubble Note - UI Fixed</title>
    <style>
        :root {
            --btn-border: rgba(255, 255, 255, 0.5);
            --btn-symbol: rgba(255, 255, 255, 0.2);
            --bg-color-val: #1a1a1a;
            --hl-color: #ffeb3b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; touch-action: none; }
        
        /* 브라우저 창 좌측에 항상 고정되도록 설정 */
        #app-container { position: relative; width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh; margin: 0; overflow: hidden; transition: background-color 0.5s; }
        
        /* ====== 폴더 연동(워크스페이스) 오버레이 ====== */
        #workspace-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 20, 20, 0.9); z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;
            backdrop-filter: blur(15px); text-align: center; padding: 20px;
        }
        #workspace-overlay h2 { font-size: 28px; margin-bottom: 10px; }
        #workspace-overlay p { color: #ccc; margin-bottom: 5px; font-size: 15px; white-space: pre-line; }
        .workspace-btn {
            padding: 15px 35px; font-size: 18px; font-weight: bold; margin-top: 25px;
            background: #4caf50; color: white; border: 2px solid rgba(255,255,255,0.2); border-radius: 12px;
            cursor: pointer; transition: transform 0.2s, background 0.2s; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .workspace-btn:hover { transform: scale(1.05); background: #45a049; }
        #reset-folder-btn {
            margin-top: 15px; font-size: 13px; color: #ffeb3b; background: transparent; border: none; cursor: pointer; text-decoration: underline; display: none;
        }

        /* ====== 암호화(비밀번호) 오버레이 ====== */
        #password-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 20, 20, 0.95); z-index: 10500;
            display: none; flex-direction: column; align-items: center; justify-content: center; color: white;
            backdrop-filter: blur(15px); text-align: center; padding: 20px;
        }
        #password-overlay h2 { font-size: 24px; margin-bottom: 10px; color: #ffeb3b; }
        #password-overlay p { color: #ccc; margin-bottom: 20px; font-size: 14px; max-width: 360px; line-height: 1.5; white-space: pre-line; }
        .pw-input {
            padding: 12px 20px; font-size: 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.4);
            background: rgba(0,0,0,0.5); color: white; outline: none; margin-bottom: 12px; width: 260px; text-align: center;
        }
        .pw-input:focus { border-color: #ffeb3b; }
        .pw-btn {
            padding: 12px 30px; font-size: 16px; font-weight: bold; background: #4caf50; color: white;
            border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s; margin-top: 5px; width: 260px;
        }
        .pw-btn:hover { background: #45a049; }
        .pw-sub-btn {
            margin-top: 15px; font-size: 13px; color: #aaa; background: transparent;
            border: none; cursor: pointer; text-decoration: underline;
        }
        .pw-sub-btn:hover { color: #fff; }
        #pw-error { color: #ff4d4d; font-size: 13px; margin-top: 10px; display: none; font-weight: bold; }

        /* ====== 동기화(가져오기/내보내기) 모달 ====== */
        #sync-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 20, 20, 0.92); z-index: 10200;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            color: white; backdrop-filter: blur(15px); text-align: center; padding: 20px;
        }
        .sync-card {
            background: #2a2a2a; border: 1px solid rgba(255,255,255,0.2); border-radius: 16px;
            padding: 24px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px;
        }
        .sync-card h3 { font-size: 18px; color: #ffeb3b; margin-bottom: 4px; }
        .sync-card p { font-size: 13px; color: #ccc; line-height: 1.4; margin-bottom: 8px; }
        .sync-action-btn {
            padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.25);
            background: #383838; color: white; font-size: 14px; font-weight: bold; cursor: pointer;
        }
        .sync-action-btn.primary { background: #4caf50; border: none; }

        /* 드래그 상태 툴팁 */
        #detach-tooltip, #attach-tooltip {
            display: none; position: fixed; padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 14px; pointer-events: none; z-index: 9999; box-shadow: 0 4px 15px rgba(0,0,0,0.5); background: rgba(0,0,0,0.8);
            transform: translate(-50%, -50%);
        }
        #detach-tooltip { border: 2px solid #ff4d4d; color: #ff4d4d; }
        #attach-tooltip { border: 2px solid #4caf50; color: #4caf50; }

        /* 상단 검색어 입력 폼 및 잠금/동기화 버튼 */
        .search-wrapper { position: absolute; top: 30px; left: 30px; z-index: 2500; display: flex; align-items: center; }
        .search-input-container { position: relative; display: flex; align-items: center; }
        .search-input { padding: 12px 35px 12px 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.4); background: rgba(0,0,0,0.3); color: #fff; outline: none; font-size: 15px; width: 230px; backdrop-filter: blur(5px); }
        .search-clear { position: absolute; right: 12px; font-size: 20px; font-weight: bold; color: rgba(255,255,255,0.5); cursor: pointer; display: none; transition: color 0.2s; line-height: 1; }
        .search-clear:hover { color: #fff; }

        #lock-app-btn, #sync-io-btn {
            margin-left: 8px; width: 42px; height: 42px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.4); background: rgba(0,0,0,0.3);
            color: white; font-size: 16px; cursor: pointer; backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center; transition: background 0.2s, transform 0.1s; flex-shrink: 0;
        }
        #lock-app-btn:hover, #sync-io-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }
        #sync-io-btn { display: none; }

        /* ====== 하단 4개 도크 아이콘 정렬 ====== */
        .dock-icon {
            position: absolute; bottom: 30px; width: 50px; height: 50px;
            border-radius: 50%; z-index: 2500; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        #bg-color-dock { left: 30px; }
        #hl-color-dock { left: 95px; }

        .dock-icon input[type="color"] {
            position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
            opacity: 0; cursor: pointer; z-index: 2;
        }
        
        .bg-icon-visual {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%; box-sizing: border-box; pointer-events: none;
            border: 5px solid #222;
            background-color: var(--bg-color-val);
            box-shadow: inset 0 0 0 1px #000;
        }
        .hl-icon-visual {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%; box-sizing: border-box; pointer-events: none;
            border: 10px solid var(--hl-color);
            background-color: #fff;
            box-shadow: inset 0 0 0 1px #000;
        }

        /* ====== 독립된 검색 결과 창 ====== */
        #search-result-window {
            position: absolute; bottom: 30px; left: 330px;
            background: rgba(35, 35, 35, 0.9); border: 2px solid var(--btn-border); backdrop-filter: blur(15px); z-index: 2000;
            overflow: hidden; transform-origin: bottom left;
            transition: width 0.5s cubic-bezier(0.25, 1, 0.5, 1), height 0.5s cubic-bezier(0.25, 1, 0.5, 1), 
                        transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s, border-radius 0.5s, left 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        #search-result-window.state-hidden { width: 0; height: 0; opacity: 0; transform: scale(0); pointer-events: none; border: none; }
        #search-result-window.state-expanded { 
            width: 1500px; height: 2000px; 
            max-width: calc(100% - 360px); max-height: calc(100% - 150px); 
            border-radius: 20px; opacity: 1; transform: scale(1); pointer-events: auto; 
            left: 330px; top: auto;
        }
        #search-result-window.state-collapsed { 
            width: 50px; height: 50px; border-radius: 50%; opacity: 1; transform: scale(1); pointer-events: auto; cursor: pointer; 
            left: 225px; bottom: 30px; top: auto;
        }
        #search-result-content { display: flex; flex-wrap: wrap; gap: 25px; padding: 25px; align-content: flex-start; overflow-y: auto; width: 100%; height: 100%; transition: opacity 0.3s; }
        #search-result-window.state-collapsed #search-result-content, #search-result-window.state-hidden #search-result-content { opacity: 0; pointer-events: none; }
        #search-collapsed-icon { display: none; width: 100%; height: 100%; align-items: center; justify-content: center; font-size: 24px; color: white; }
        #search-result-window.state-collapsed #search-collapsed-icon { display: flex; }

        /* ====== 좌하단 즐겨찾기 창 ====== */
        #favorite-window {
            position: absolute; bottom: 30px; left: 330px;
            background: rgba(35, 35, 35, 0.9); border: 2px solid var(--btn-border); backdrop-filter: blur(15px); z-index: 2000;
            overflow: hidden; transform-origin: bottom left;
            transition: width 0.5s cubic-bezier(0.25, 1, 0.5, 1), height 0.5s cubic-bezier(0.25, 1, 0.5, 1), 
                        transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s, border-radius 0.5s, left 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        #favorite-window.state-expanded { 
            width: 1500px; height: 2000px; 
            max-width: calc(100% - 360px); max-height: calc(100% - 150px); 
            border-radius: 20px; opacity: 1; transform: scale(1); pointer-events: auto; 
            left: 330px; top: auto;
        }
        #favorite-window.state-collapsed { width: 50px; height: 50px; border-radius: 50%; opacity: 1; transform: scale(1); pointer-events: auto; cursor: pointer; left: 160px; bottom: 30px; }
        #favorite-content { display: flex; flex-wrap: wrap; gap: 25px; padding: 25px; align-content: flex-start; overflow-y: auto; width: 100%; height: 100%; transition: opacity 0.3s; }
        #favorite-window.state-collapsed #favorite-content { opacity: 0; pointer-events: none; }
        #favorite-collapsed-icon { display: none; width: 100%; height: 100%; align-items: center; justify-content: center; font-size: 26px; color: #ffeb3b; }
        #favorite-window.state-collapsed #favorite-collapsed-icon { display: flex; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }

        /* 검색 결과 버블 아이템 */
        .search-result-bubble { width: 120px; height: 120px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: transform 0.1s; position: relative; flex-shrink: 0; }
        .search-result-bubble:hover { transform: scale(1.05); }
        .search-result-bubble .bubble-title { font-size: 14px; font-weight: 600; max-width: 80%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; pointer-events: none; color: #333; z-index: 2; }
        .search-result-bubble .bubble-meta { font-size: 10px; color: #666; background: rgba(0,0,0,0.1); padding: 2px 6px; border-radius: 4px; margin-top: 5px; pointer-events: none; z-index: 2; }

        /* 좌측 폴더 트리 뷰 */
        #mobile-tree-toggle { display: none; position: absolute; top: 90px; left: 15px; width: 45px; height: 45px; border-radius: 50%; background: rgba(0,0,0,0.4); color: white; border: 1px solid rgba(255,255,255,0.3); align-items: center; justify-content: center; font-size: 20px; cursor: pointer; z-index: 3001; backdrop-filter: blur(5px); }
        #tree-view { position: absolute; top: 90px; left: 30px; width: 280px; bottom: 120px; overflow-y: auto; color: #fff; font-size: 14px; z-index: 3000; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 12px; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        #tree-view ul { list-style: none; padding-left: 18px; margin: 4px 0; } #tree-view > ul { padding-left: 0; }
        .tree-item { position: relative; display: flex; align-items: center; padding: 6px; cursor: pointer; border-radius: 6px; transition: background 0.2s; }
        .tree-item:active { cursor: pointer; } .tree-item:hover { background: rgba(255,255,255,0.15); }
        .tree-active { background: rgba(255,255,255,0.3) !important; font-weight: bold; border-left: 3px solid #fff; }
        .tree-drag-over { background: rgba(76, 175, 80, 0.4) !important; border: 1px dashed #4caf50; }
        /* 순서 변경 시 위/아래 얇은 가로선 표시 효과 */
        .tree-reorder-top { box-shadow: inset 0 2px 0 0 #ffeb3b !important; border-top-left-radius: 0 !important; border-top-right-radius: 0 !important; }
        .tree-reorder-bottom { box-shadow: inset 0 -2px 0 0 #ffeb3b !important; border-bottom-left-radius: 0 !important; border-bottom-right-radius: 0 !important; }

        .tree-toggle { display: inline-flex; justify-content: center; align-items: center; width: 18px; height: 18px; border: 1px solid rgba(255,255,255,0.6); margin-right: 8px; border-radius: 4px; font-size: 12px; line-height: 1; font-weight: bold; cursor: pointer; }
        .tree-spacer { width: 18px; margin-right: 8px; } .tree-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
        
        .tree-reorder-btn { display: none; margin-left: auto; color: rgba(255,255,255,0.6); font-weight: bold; cursor: pointer; padding: 0 4px; border-radius: 4px; font-size: 15px; }
        .tree-delete-btn { display: none; margin-left: 5px; color: rgba(255,255,255,0.5); font-weight: bold; cursor: pointer; padding: 0 4px; border-radius: 4px; }
        .tree-item:hover .tree-reorder-btn, .tree-item:hover .tree-delete-btn { display: block; } 
        .tree-reorder-btn:hover { color: #fff; background: rgba(255,255,255,0.3); }
        .tree-reorder-btn:active { cursor: pointer; }
        .tree-delete-btn:hover { color: #fff; background: rgba(255,77,77,0.8); }

        /* 설정 및 컨트롤 버튼 (우측 하단 & 에디터 내부) */
        .color-picker { width: 30px; height: 30px; border: none; border-radius: 50%; cursor: pointer; background: transparent; padding: 0; flex-shrink: 0; outline: none; }
        .color-picker::-webkit-color-swatch-wrapper { padding: 0; }
        .color-picker::-webkit-color-swatch { border: 2px solid #999; border-radius: 50%; }
        .color-picker::-moz-color-swatch { border: 2px solid #999; border-radius: 50%; }

        .action-buttons { position: absolute; bottom: 30px; right: 30px; display: flex; gap: 15px; z-index: 1000; }
        .action-btn { width: 60px; height: 60px; border: 2px solid var(--btn-border); border-radius: 12px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s; color: var(--btn-symbol); }
        .action-btn:active { transform: scale(0.95); } .action-btn span { font-size: 24px; font-weight: 300; line-height: 1; } .action-btn small { font-size: 10px; margin-top: 2px; }

        /* ===== 아이템 노드 & 버블 ===== */
        .item-node {
            position: absolute; display: flex; flex-direction: column; 
            transition: left 0.5s cubic-bezier(0.25, 1, 0.5, 1), top 0.5s cubic-bezier(0.25, 1, 0.5, 1), 
                        width 0.5s cubic-bezier(0.25, 1, 0.5, 1), height 0.5s cubic-bezier(0.25, 1, 0.5, 1), 
                        border-radius 0.5s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.3s,
                        opacity 0.5s ease, transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s;
            transform: translate(-50%, -50%) scale(1); opacity: 1;
        }
        .item-node.animating-out, .item-node.animating-in { opacity: 0 !important; transform: translate(-50%, -50%) scale(0) !important; }
        .semi-transparent { opacity: 0.25 !important; }

        .item-node.bubble { width: 120px; height: 120px; border-radius: 50%; align-items: center; justify-content: center; text-align: center; cursor: pointer; z-index: 10; }
        .item-node.bubble:active { cursor: pointer; }
        .item-node.bubble .bubble-title { font-size: 14px; font-weight: 600; max-width: 80%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; pointer-events: none; color: #333; z-index: 2; }
        .item-node.bubble .bubble-meta { font-size: 10px; color: #666; background: rgba(0,0,0,0.1); padding: 2px 6px; border-radius: 4px; margin-top: 5px; pointer-events: none; z-index: 2; }
        .item-node.bubble .editor-ui { display: none; }

        /* 그룹 버블 - 8각형 */
        .item-node.bubble.type-group, .search-result-bubble.type-group { width: 132px !important; height: 132px !important; border-radius: 0 !important; background-color: transparent !important; border: none !important; box-shadow: none !important; }
        .item-node.bubble.type-group::before, .search-result-bubble.type-group::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border-color); clip-path: polygon(29.3% 0%, 70.7% 0%, 100% 29.3%, 100% 70.7%, 70.7% 100%, 29.3% 100%, 0% 70.7%, 0% 29.3%); z-index: -2; transition: all 0.3s; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2)); }
        .item-node.bubble.type-group.search-match::before, .search-result-bubble.type-group.search-match::before { top: -5px; left: -5px; right: -5px; bottom: -5px; background-color: var(--search-color) !important; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4)); }
        .item-node.bubble.type-group::after, .search-result-bubble.type-group::after { content: ''; position: absolute; top: 3px; left: 3px; right: 3px; bottom: 3px; background-color: var(--bg-color); clip-path: polygon(29.3% 0%, 70.7% 0%, 100% 29.3%, 100% 70.7%, 70.7% 100%, 29.3% 100%, 0% 70.7%, 0% 29.3%); z-index: -1; transition: background-color 0.3s; }

        /* ====== 메모창 에디터 (폭 750px / 그룹창 550px 컴팩트 분리) ====== */
        .item-node.editor { height: 500px; border-radius: 20px; cursor: default; z-index: 500; padding: 20px; }
        .item-node.editor.type-note { width: 750px; }
        .item-node.editor.type-group { width: 550px; height: auto !important; padding: 20px 20px 15px 20px; }
        .item-node.editor.type-group .editor-ui { height: auto; }
        .item-node.editor.type-group .editor-controls { margin-bottom: 0; }
        .item-node.editor.type-group .editor-body { display: none !important; }
        
        .item-node.editor .bubble-title, .item-node.editor .bubble-meta { display: none; }
        .item-node.editor .editor-ui { display: flex; flex-direction: column; width: 100%; height: 100%; position: relative; padding-top: 15px; }
        
        .editor-drag-handle { position: absolute; top: -20px; left: -20px; right: -20px; height: 35px; background: rgba(0,0,0,0.05); border-radius: 20px 20px 0 0; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .editor-drag-handle:active { cursor: pointer; }
        .drag-bar { width: 50px; height: 5px; background: rgba(0,0,0,0.2); border-radius: 3px; }
        
        .editor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .editor-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; padding-right: 65px; }
        
        .tags-wrapper { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; background: rgba(255,255,255,0.4); padding: 4px 8px; border-radius: 8px; border: 1px solid #ddd; min-width: 120px; max-height: 60px; overflow-y: auto; }
        .chips-container { display: flex; gap: 4px; flex-wrap: wrap; }
        .tag-chip { background: rgba(0,0,0,0.1); color: #333; padding: 2px 6px; border-radius: 4px; font-size: 12px; display: flex; align-items: center; gap: 4px; border: 1px solid rgba(0,0,0,0.2); }
        .tag-chip-del { cursor: pointer; font-weight: bold; color: #ff4d4d; }
        .tag-input { border: none; background: transparent; outline: none; font-size: 13px; width: 80px; color: #333; }
        
        .title-input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background: rgba(255,255,255,0.5); outline: none; flex: 1; font-weight: bold; }
        
        .appearance-controls { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #333; background: rgba(255,255,255,0.4); padding: 5px 10px; border-radius: 8px; }
        .opacity-slider { width: 50px; cursor: pointer; }
        
        .btn-favorite.inline-fav { position: relative; background: transparent; border: none; font-size: 20px; cursor: pointer; color: rgba(0,0,0,0.3); margin-left: 8px; transition: transform 0.2s, color 0.2s; display: flex; align-items: center; justify-content: center; padding: 0; line-height: 1; }
        .btn-favorite.inline-fav:hover { transform: scale(1.2); color: rgba(0,0,0,0.6); }
        .btn-favorite.inline-fav.active { color: #ffeb3b; text-shadow: 0 0 5px rgba(0,0,0,0.3); }

        .btn-minimize { position: absolute; right: 36px; top: 0; background: #4caf50; color: white; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; z-index: 10; }

<body>

    <script>
        let appData = { bgColor: '#1a1a1a', searchHighlightColor: '#ffeb3b', items: [] };
        let dirHandle = null; 
        
        let activeItemId = null; 
        let currentParentId = null; 
        let searchQuery = '';
        let searchWindowState = 'hidden'; 
        let favoriteWindowState = 'collapsed';
        
        window.__dragHandled = false; 
        window.__dragSource = null; 
        window.__dragStartX = null;
        window.__dragStartY = null;
        window.__draggedItem = null;
        window.__dragMode = 'group'; 
        window.__reorderPosition = null;

        const container = document.getElementById('nodes-container');
        const appContainer = document.getElementById('app-container');
        const backdrop = document.getElementById('backdrop');
        const treeToggleBtn = document.getElementById('mobile-tree-toggle');
        const treeView = document.getElementById('tree-view');
        treeToggleBtn.addEventListener('click', () => { treeView.classList.toggle('open'); });
        
        document.addEventListener('mouseup', () => { window.__dragMode = 'group'; });
        document.addEventListener('touchend', () => { window.__dragMode = 'group'; }, {passive: true});

        function isMobileEnv() {
            return window.matchMedia('(max-width: 768px) and (pointer: coarse)').matches;
        }

        function hexToRgba(hex, opacity) {
            if (!hex || typeof hex !== 'string' || !hex.startsWith('#')) hex = '#ffffff';
            let r = parseInt(hex.slice(1, 3), 16) || 255;
            let g = parseInt(hex.slice(3, 5), 16) || 255;
            let b = parseInt(hex.slice(5, 7), 16) || 255;
            return `rgba(${r}, ${g}, ${b}, ${opacity ?? 1})`;
        }
        function generateId() { return 'id_' + Math.random().toString(36).substr(2, 9); }
        function stripHtml(html) { let tmp = document.createElement("DIV"); tmp.innerHTML = html; return tmp.textContent || tmp.innerText || ""; }

        const DB_NAME = 'BubbleNoteDB';
        function initDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => { e.target.result.createObjectStore('handles'); };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }
        async function saveHandleToDB(handle) {
            const db = await initDB();
            const tx = db.transaction('handles', 'readwrite');
            tx.objectStore('handles').put(handle, 'workspaceHandle');
            return new Promise(resolve => tx.oncomplete = resolve);
        }
        async function getHandleFromDB() {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const req = db.transaction('handles').objectStore('handles').get('workspaceHandle');
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }
        async function clearHandleFromDB() {
            const db = await initDB();
            const tx = db.transaction('handles', 'readwrite');
            tx.objectStore('handles').delete('workspaceHandle');
            return new Promise(resolve => tx.oncomplete = resolve);
        }

        async function verifyPermission(fileHandle, readWrite) {
            const options = { mode: readWrite ? 'readwrite' : 'read' };
            if ((await fileHandle.queryPermission(options)) === 'granted') return true;
            if ((await fileHandle.requestPermission(options)) === 'granted') return true;
            return false;
        }

        // ====== [모바일 호환: IndexedDB 기반 가상 디렉터리 핸들] ======
        const MOBILE_FS_STORE = 'mobile_files';
        function initMobileFS() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open('BubbleNoteMobileFS', 1);
                req.onupgradeneeded = (e) => {
                    if (!e.target.result.objectStoreNames.contains(MOBILE_FS_STORE)) {
                        e.target.result.createObjectStore(MOBILE_FS_STORE);
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function createVirtualDirHandle() {
            return {
                isVirtual: true,
                name: 'MobileStorage',
                async getFileHandle(filename, options = {}) {
                    const db = await initMobileFS();
                    const existing = await new Promise((resolve, reject) => {
                        const req = db.transaction(MOBILE_FS_STORE, 'readonly').objectStore(MOBILE_FS_STORE).get(filename);
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = () => reject(req.error);
                    });

                    if (existing === undefined && !options.create) {
                        throw new Error('FileNotFound: ' + filename);
                    }

                    return {
                        name: filename,
                        async getFile() {
                            const db2 = await initMobileFS();
                            const data = await new Promise((resolve, reject) => {
                                const req = db2.transaction(MOBILE_FS_STORE, 'readonly').objectStore(MOBILE_FS_STORE).get(filename);
                                req.onsuccess = () => resolve(req.result);
                                req.onerror = () => reject(req.error);
                            });
                            if (data === undefined) throw new Error('FileNotFound');
                            return new Blob([data]);
                        },
                        async createWritable() {
                            let chunks = [];
                            return {
                                async write(data) {
                                    if (typeof data === 'string') {
                                        chunks.push(new TextEncoder().encode(data));
                                    } else if (data instanceof ArrayBuffer) {
                                        chunks.push(new Uint8Array(data));
                                    } else if (ArrayBuffer.isView(data)) {
                                        chunks.push(new Uint8Array(data.buffer, data.byteOffset, data.byteLength));
                                    } else if (data instanceof Blob) {
                                        chunks.push(new Uint8Array(await data.arrayBuffer()));
                                    }
                                },
                                async close() {
                                    let totalLen = chunks.reduce((acc, c) => acc + c.byteLength, 0);
                                    let merged = new Uint8Array(totalLen);
                                    let offset = 0;
                                    for (let c of chunks) { merged.set(c, offset); offset += c.byteLength; }
                                    const db2 = await initMobileFS();
                                    const tx = db2.transaction(MOBILE_FS_STORE, 'readwrite');
                                    tx.objectStore(MOBILE_FS_STORE).put(merged.buffer, filename);
                                    return new Promise(resolve => tx.oncomplete = resolve);
                                }
                            };
                        }
                    };
                },
                async removeEntry(filename) {
                    const db = await initMobileFS();
                    const tx = db.transaction(MOBILE_FS_STORE, 'readwrite');
                    tx.objectStore(MOBILE_FS_STORE).delete(filename);
                    return new Promise(resolve => tx.oncomplete = resolve);
                }
            };
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const supportsFileSystem = ('showDirectoryPicker' in window);
            const isMobile = isMobileEnv();

            // 1. 스마트폰(갤럭시/아이폰)에서는 폴더 제한(Download 폴더 차단 등)을 피하기 위해
            //    폴더 선택기 대신 가상 보안 스토리지 + 직접 파일 불러오기(📂) 모드로 작동
            if (!supportsFileSystem || isMobile) {
                dirHandle = createVirtualDirHandle();
                document.getElementById('sync-io-btn').style.display = 'flex';
                try {
                    // 이전에 모바일에서 불러왔던 데이터가 있으면 첫 화면 없이 바로 비밀번호 창으로 진입
                    await dirHandle.getFileHandle('data.json', { create: false });
                    document.getElementById('workspace-overlay').style.display = 'none';
                    await loadFromDisk();
                } catch (e) {
                    document.getElementById('workspace-title').innerText = "스마트폰 보안 노트";
                    document.getElementById('workspace-desc').innerText = "폴더 이동 없이 상단 📂 버튼으로 다운로드 폴더나 OneDrive의 data.json을 바로 불러올 수 있습니다.";
                    document.getElementById('workspace-btn').innerText = "바로 시작하기";
                }
                return;
            }

            // 2. PC 환경: '방문할 때마다 허용'으로 이미 권한이 부여된 상태라면 버튼 화면을 즉시 건너뜀
            try {
                const storedHandle = await getHandleFromDB();
                if (storedHandle) {
                    dirHandle = storedHandle;
                    const perm = await dirHandle.queryPermission({ mode: 'readwrite' });
                    if (perm === 'granted') {
                        document.getElementById('workspace-overlay').style.display = 'none';
                        await loadFromDisk();
                        return;
                    }

                    document.getElementById('workspace-title').innerText = "이전 폴더 연결하기";
                    document.getElementById('workspace-desc').innerText = `"${dirHandle.name}" 폴더의 접근 권한을 다시 허용해주세요.`;
                    document.getElementById('workspace-btn').innerText = "폴더 접근 허용";
                    document.getElementById('workspace-btn').onclick = async () => {
                        if (await verifyPermission(dirHandle, true)) {
                            document.getElementById('workspace-overlay').style.display = 'none';
                            await loadFromDisk();
                        }
                    };
                    document.getElementById('reset-folder-btn').style.display = 'inline-block';
                }
            } catch (e) { console.log("DB 확인 오류:", e); }
        });

        async function openWorkspace() {
            if (!('showDirectoryPicker' in window) || isMobileEnv()) {
                dirHandle = createVirtualDirHandle();
                document.getElementById('sync-io-btn').style.display = 'flex';
                document.getElementById('workspace-overlay').style.display = 'none';
                await loadFromDisk();
                return;
            }
            try {
                dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                await saveHandleToDB(dirHandle);
                document.getElementById('workspace-overlay').style.display = 'none';
                await loadFromDisk();
            } catch (e) {
                console.error("폴더 접근 취소 또는 오류:", e);
            }
        }

        async function resetFolder() {
            await clearHandleFromDB();
            dirHandle = null;
            document.getElementById('workspace-title').innerText = "저장 공간(폴더) 선택";
            document.getElementById('workspace-desc').innerText = "OneDrive 또는 iCloud Drive 내에 생성한 폴더를 선택해주세요.";
            document.getElementById('workspace-btn').innerText = "새로운 폴더 선택하기";
            document.getElementById('workspace-btn').onclick = openWorkspace;
            document.getElementById('reset-folder-btn').style.display = 'none';
        }

        function openSyncModal() { document.getElementById('sync-modal').style.display = 'flex'; }
        function closeSyncModal() { document.getElementById('sync-modal').style.display = 'none'; }

        async function exportBackupFile() {
            if (!dirHandle || !sessionCryptoKey) return;
            await flushSave();
            try {
                const fh = await dirHandle.getFileHandle('data.json', { create: false });
                const file = await fh.getFile();
                const blob = new Blob([await file.arrayBuffer()], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'data.json';
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
                closeSyncModal();
            } catch (e) {
                alert("내보낼 데이터가 없습니다.");
            }
        }

        async function importBackupFiles(event) {
            const files = Array.from(event.target.files);
            if (!files.length || !dirHandle) return;

            let hasDataJson = false;
            for (let f of files) {
                const targetName = f.name.endsWith('.json') ? 'data.json' : f.name;
                if (targetName === 'data.json') hasDataJson = true;
                const fh = await dirHandle.getFileHandle(targetName, { create: true });
                const writable = await fh.createWritable();
                await writable.write(await f.arrayBuffer());
                await writable.close();
            }
            event.target.value = '';
            closeSyncModal();

            if (hasDataJson) {
                sessionCryptoKey = null;
                sessionSalt = null;
                activeItemId = null;
                currentParentId = null;
                await loadFromDisk();
            } else {
                await processImagesForRender();
                render();
            }
        }

        // ====== [보안 강화: 세션 키 관리 및 비동기 저장 큐 변수] ======
        let sessionCryptoKey = null;
        let sessionSalt = null;
        const PBKDF2_ITERATIONS = 600000;
        const IMG_MAGIC = new Uint8Array([0x42, 0x4E, 0x45, 0x31]); // 'BNE1'

        let saveTimeout = null;
        let isSaving = false;
        let savePending = false;
        let activeBlobUrls = [];

        const CryptoUtil = {
            bufferToBase64(buffer) {
                const bytes = new Uint8Array(buffer);
                let binary = '';
                const chunkSize = 0x8000;
                for (let i = 0; i < bytes.length; i += chunkSize) {
                    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
                }
                return btoa(binary);
            },
            base64ToBuffer(base64) {
                const binaryString = atob(base64);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                return bytes.buffer;
            },
            async deriveKey(password, saltBuffer, iterations = PBKDF2_ITERATIONS) {
                const enc = new TextEncoder();
                const keyMaterial = await crypto.subtle.importKey(
                    "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
                );
                return crypto.subtle.deriveKey(
                    { name: "PBKDF2", salt: saltBuffer, iterations: iterations, hash: "SHA-256" },
                    keyMaterial,
                    { name: "AES-GCM", length: 256 },
                    false,
                    ["encrypt", "decrypt"]
                );
            },
            async encryptWithSessionKey(plainText) {
                if (!sessionCryptoKey || !sessionSalt) throw new Error("Locked");
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const enc = new TextEncoder();
                const cipherBuffer = await crypto.subtle.encrypt(
                    { name: "AES-GCM", iv: iv },
                    sessionCryptoKey,
                    enc.encode(plainText)
                );
                return {
                    encrypted: true,
                    iterations: PBKDF2_ITERATIONS,
                    salt: this.bufferToBase64(sessionSalt),
                    iv: this.bufferToBase64(iv),
                    ciphertext: this.bufferToBase64(cipherBuffer)
                };
            },
            async decryptWithPassword(encryptedObj, password) {
                const salt = new Uint8Array(this.base64ToBuffer(encryptedObj.salt));
                const iv = new Uint8Array(this.base64ToBuffer(encryptedObj.iv));
                const cipherBuffer = this.base64ToBuffer(encryptedObj.ciphertext);
                const iterations = encryptedObj.iterations || 100000;

                const key = await this.deriveKey(password, salt, iterations);
                try {
                    const decBuffer = await crypto.subtle.decrypt(
                        { name: "AES-GCM", iv: iv }, key, cipherBuffer
                    );
                    return {
                        text: new TextDecoder().decode(decBuffer),
                        key: key,
                        salt: salt,
                        needsUpgrade: iterations !== PBKDF2_ITERATIONS
                    };
                } catch (e) {
                    throw new Error("WrongPassword");
                }
            },
            async encryptBinary(arrayBuffer) {
                if (!sessionCryptoKey) throw new Error("Locked");
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const cipherBuffer = await crypto.subtle.encrypt(
                    { name: "AES-GCM", iv: iv }, sessionCryptoKey, arrayBuffer
                );
                const cipherBytes = new Uint8Array(cipherBuffer);
                const out = new Uint8Array(4 + 12 + cipherBytes.length);
                out.set(IMG_MAGIC, 0);
                out.set(iv, 4);
                out.set(cipherBytes, 16);
                return out.buffer;
            },
            isEncryptedBinary(arrayBuffer) {
                if (arrayBuffer.byteLength < 16) return false;
                const head = new Uint8Array(arrayBuffer, 0, 4);
                return head[0] === 0x42 && head[1] === 0x4E && head[2] === 0x45 && head[3] === 0x31;
            },
            async decryptBinary(arrayBuffer) {
                if (!sessionCryptoKey) throw new Error("Locked");
                const iv = new Uint8Array(arrayBuffer, 4, 12);
                const cipherBytes = new Uint8Array(arrayBuffer, 16);
                return await crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv }, sessionCryptoKey, cipherBytes
                );
            }
        };

        async function loadFromDisk() {
            try {
                const fileHandle = await dirHandle.getFileHandle('data.json', { create: false });
                const file = await fileHandle.getFile();
                const text = await file.text();
                const parsed = JSON.parse(text);

                if (parsed.encrypted) {
                    showPasswordPrompt("unlock", parsed);
                } else {
                    alert("기존 평문 데이터가 감지되었습니다. 보안을 위해 마스터 비밀번호를 설정하여 데이터를 암호화합니다.");
                    appData = parsed;
                    showPasswordPrompt("setup");
                }
            } catch (e) {
                console.log("기존 데이터 파일이 없으므로 새로 시작합니다.");
                appData = { bgColor: '#1a1a1a', searchHighlightColor: '#ffeb3b', items: [] };
                showPasswordPrompt("setup");
            }
        }

        async function lockApp() {
            if (!dirHandle || !sessionCryptoKey) return;
            await flushSave();
            sessionCryptoKey = null;
            sessionSalt = null;
            activeItemId = null;
            currentParentId = null;

            activeBlobUrls.forEach(url => URL.revokeObjectURL(url));
            activeBlobUrls = [];

            container.innerHTML = '';
            document.getElementById('tree-view').innerHTML = '';
            await loadFromDisk();
        }

        function showPasswordPrompt(mode, encryptedData = null) {
            const overlay = document.getElementById('password-overlay');
            const inputCurrent = document.getElementById('pw-input-current');
            const input = document.getElementById('pw-input');
            const inputConfirm = document.getElementById('pw-input-confirm');
            const btn = document.getElementById('pw-btn');
            const title = document.getElementById('pw-title');
            const desc = document.getElementById('pw-desc');
            const error = document.getElementById('pw-error');
            const changeModeBtn = document.getElementById('pw-change-mode-btn');

            overlay.style.display = 'flex';
            inputCurrent.value = '';
            input.value = '';
            inputConfirm.value = '';
            error.style.display = 'none';

            const showError = (msg) => {
                error.innerText = msg;
                error.style.display = 'block';
            };

            if (mode === "setup") {
                title.innerText = "마스터 비밀번호 초기 설정";
                desc.innerText = "노트와 첨부 이미지를 암호화할 비밀번호를 설정해주세요.\n(주의: 비밀번호 분실 시 데이터 복구가 절대 불가능합니다)";
                inputCurrent.style.display = 'none';
                input.placeholder = "새 비밀번호 입력 (4자 이상)";
                inputConfirm.style.display = 'block';
                changeModeBtn.style.display = 'none';
                input.focus();
            } else if (mode === "unlock") {
                title.innerText = "보안 잠금 해제";
                desc.innerText = "데이터를 복호화하기 위해 마스터 비밀번호를 입력해주세요.";
                inputCurrent.style.display = 'none';
                input.placeholder = "비밀번호 입력";
                inputConfirm.style.display = 'none';
                changeModeBtn.style.display = 'inline-block';
                changeModeBtn.innerText = "마스터 비밀번호 변경하기";
                changeModeBtn.onclick = () => showPasswordPrompt("change", encryptedData);
                input.focus();
            } else if (mode === "change") {
                title.innerText = "마스터 비밀번호 변경";
                desc.innerText = "현재 비밀번호와 새로 사용할 비밀번호를 입력해주세요.";
                inputCurrent.style.display = 'block';
                input.placeholder = "새 비밀번호 입력 (4자 이상)";
                inputConfirm.style.display = 'block';
                changeModeBtn.style.display = 'inline-block';
                changeModeBtn.innerText = "잠금 해제로 돌아가기";
                changeModeBtn.onclick = () => showPasswordPrompt("unlock", encryptedData);
                inputCurrent.focus();
            }

            const handleConfirm = async () => {
                const pw = input.value;
                error.style.display = 'none';
                btn.disabled = true;
                btn.innerText = "보안 처리 중...";

                try {
                    if (mode === "setup") {
                        if (pw.length < 4) { showError("비밀번호는 최소 4자 이상이어야 합니다."); return; }
                        if (pw !== inputConfirm.value) { showError("비밀번호 재입력이 일치하지 않습니다."); return; }

                        sessionSalt = crypto.getRandomValues(new Uint8Array(16));
                        sessionCryptoKey = await CryptoUtil.deriveKey(pw, sessionSalt, PBKDF2_ITERATIONS);

                        overlay.style.display = 'none';
                        await completeAppLoad();
                        await save(true);
                    } else if (mode === "unlock") {
                        if (!pw) return;
                        const res = await CryptoUtil.decryptWithPassword(encryptedData, pw);
                        appData = JSON.parse(res.text);

                        if (res.needsUpgrade) {
                            sessionSalt = crypto.getRandomValues(new Uint8Array(16));
                            sessionCryptoKey = await CryptoUtil.deriveKey(pw, sessionSalt, PBKDF2_ITERATIONS);
                        } else {
                            sessionSalt = res.salt;
                            sessionCryptoKey = res.key;
                        }

                        overlay.style.display = 'none';
                        await completeAppLoad();
                        if (res.needsUpgrade) await save(true);
                    } else if (mode === "change") {
                        const curPw = inputCurrent.value;
                        if (!curPw || !pw) { showError("모든 입력란을 채워주세요."); return; }
                        if (pw.length < 4) { showError("새 비밀번호는 최소 4자 이상이어야 합니다."); return; }
                        if (pw !== inputConfirm.value) { showError("새 비밀번호 재입력이 일치하지 않습니다."); return; }

                        const res = await CryptoUtil.decryptWithPassword(encryptedData, curPw);
                        appData = JSON.parse(res.text);

                        sessionCryptoKey = res.key;
                        sessionSalt = res.salt;
                        const newSalt = crypto.getRandomValues(new Uint8Array(16));
                        const newKey = await CryptoUtil.deriveKey(pw, newSalt, PBKDF2_ITERATIONS);

                        await reEncryptAllImages(res.key, newKey);

                        sessionSalt = newSalt;
                        sessionCryptoKey = newKey;
                        overlay.style.display = 'none';
                        await completeAppLoad();
                        await save(true);
                        alert("마스터 비밀번호가 안전하게 변경되었습니다.");
                    }
                } catch (err) {
                    console.error(err);
                    showError("비밀번호가 일치하지 않습니다.");
                } finally {
                    btn.disabled = false;
                    btn.innerText = "확인";
                }
            };

            btn.onclick = handleConfirm;
            const onEnter = (e) => { if (e.key === 'Enter') handleConfirm(); };
            inputCurrent.onkeydown = onEnter;
            input.onkeydown = onEnter;
            inputConfirm.onkeydown = onEnter;
        }

        async function completeAppLoad() {
            if (!appData || !Array.isArray(appData.items)) {
                appData = { bgColor: '#1a1a1a', searchHighlightColor: '#ffeb3b', items: [] };
            }
            appData.items.forEach((item, index) => {
                if (!item.borderColor) item.borderColor = '#ffffff';
                if (!item.color) item.color = '#ffffff';
                if (typeof item.opacity !== 'number') item.opacity = 1.0;
                if (!item.tags) item.tags = [];
                if (typeof item.order === 'undefined') item.order = index;
                if (typeof item.isFavorite === 'undefined') item.isFavorite = false;
                // 이전에 잘못 계산되어 저장된 좌표 초기화
                delete item.targetX;
                delete item.targetY;
            });

            await processImagesForRender();
            initUI();
            render();
            renderTree();
            updateFavoriteWindow();
        }

        async function reEncryptAllImages(oldKey, newKey) {
            const filenames = new Set();
            appData.items.forEach(item => {
                if (item.type === 'note' && item.content) {
                    let tmp = document.createElement('div');
                    tmp.innerHTML = item.content;
                    tmp.querySelectorAll('img[data-filename]').forEach(img => {
                        filenames.add(img.getAttribute('data-filename'));
                    });
                }
            });

            for (let filename of filenames) {
                try {
                    const fh = await dirHandle.getFileHandle(filename);
                    const file = await fh.getFile();
                    const buf = await file.arrayBuffer();
                    let rawBytesBuffer = buf;

                    if (CryptoUtil.isEncryptedBinary(buf)) {
                        sessionCryptoKey = oldKey;
                        rawBytesBuffer = await CryptoUtil.decryptBinary(buf);
                    }
                    sessionCryptoKey = newKey;
                    const newEncBuf = await CryptoUtil.encryptBinary(rawBytesBuffer);
                    const writable = await fh.createWritable();
                    await writable.write(newEncBuf);
                    await writable.close();
                } catch (e) {
                    console.error("이미지 재암호화 건너뜀:", filename, e);
                }
            }
        }

        async function processImagesForRender() {
            activeBlobUrls.forEach(url => URL.revokeObjectURL(url));
            activeBlobUrls = [];

            for (let item of appData.items) {
                if (item.type === 'note' && item.content) {
                    let tmp = document.createElement('div');
                    tmp.innerHTML = item.content;
                    let imgs = tmp.querySelectorAll('img[data-filename]');
                    let changed = false;
                    for (let img of imgs) {
                        const filename = img.getAttribute('data-filename');
                        try {
                            const fh = await dirHandle.getFileHandle(filename);
                            const file = await fh.getFile();
                            const buf = await file.arrayBuffer();
                            let plainBuffer = buf;

                            if (CryptoUtil.isEncryptedBinary(buf)) {
                                plainBuffer = await CryptoUtil.decryptBinary(buf);
                            } else if (sessionCryptoKey) {
                                const encBuf = await CryptoUtil.encryptBinary(buf);
                                const writable = await fh.createWritable();
                                await writable.write(encBuf);
                                await writable.close();
                            }

                            const blob = new Blob([plainBuffer]);
                            const blobUrl = URL.createObjectURL(blob);
                            activeBlobUrls.push(blobUrl);
                            img.setAttribute('src', blobUrl);
                            changed = true;
                        } catch (e) {
                            console.error("이미지 파일을 읽거나 복호화할 수 없습니다:", filename);
                        }
                    }
                    if (changed) { item.content = tmp.innerHTML; }
                }
            }
        }

        function save(immediate = false) {
            if (!dirHandle || !sessionCryptoKey) return;
            if (saveTimeout) clearTimeout(saveTimeout);
            if (immediate) {
                return flushSave();
            }
            saveTimeout = setTimeout(() => {
                flushSave();
            }, 250);
        }

        async function flushSave() {
            if (!dirHandle || !sessionCryptoKey) return;
            if (isSaving) {
                savePending = true;
                return;
            }
            isSaving = true;
            try {
                do {
                    savePending = false;
                    await performSaveToDisk();
                } while (savePending);
            } catch (e) {
                console.error("데이터 저장 실패:", e);
            } finally {
                isSaving = false;
            }
        }

        async function performSaveToDisk() {
            let dataToSave = JSON.parse(JSON.stringify(appData));
            dataToSave.items.forEach(item => {
                delete item.targetX;
                delete item.targetY;
                if (item.type === 'note' && item.content) {
                    let tmp = document.createElement('div');
                    tmp.innerHTML = item.content;
                    tmp.querySelectorAll('img[data-filename]').forEach(img => {
                        img.setAttribute('src', '');
                    });
                    item.content = tmp.innerHTML;
                }
            });

            const jsonString = JSON.stringify(dataToSave);
            const encryptedObject = await CryptoUtil.encryptWithSessionKey(jsonString);

            const fileHandle = await dirHandle.getFileHandle('data.json', { create: true });
            const writable = await fileHandle.createWritable();
            await writable.write(JSON.stringify(encryptedObject, null, 2));
            await writable.close();
        }

        function deleteItemAndChildren(id) {
            let idsToDelete = [id];
            const getChildren = (parentId) => { appData.items.filter(i => i.parentId === parentId).forEach(child => { idsToDelete.push(child.id); getChildren(child.id); }); };
            getChildren(id);
            
            idsToDelete.forEach(delId => {
                let dItem = appData.items.find(i => i.id === delId);
                if(dItem && dItem.type === 'note' && dItem.content) {
                    let tmp = document.createElement('div');
                    tmp.innerHTML = dItem.content;
                    tmp.querySelectorAll('img[data-filename]').forEach(img => {
                        const fname = img.getAttribute('data-filename');
                        if (fname && dirHandle) dirHandle.removeEntry(fname).catch(e => {});
                    });
                }
            });

            appData.items = appData.items.filter(i => !idsToDelete.includes(i.id));
            if (idsToDelete.includes(activeItemId)) activeItemId = null;
            save(); render(); updateSearchWindow(); updateFavoriteWindow();
        }

        function initUI() {
            const bgColor = appData.bgColor || '#1a1a1a';
            document.getElementById('bg-color').value = bgColor;
            appContainer.style.backgroundColor = bgColor;
            document.documentElement.style.setProperty('--bg-color-val', bgColor);
            
            const hlColor = appData.searchHighlightColor || '#ffeb3b';
            document.getElementById('search-color').value = hlColor;
            document.documentElement.style.setProperty('--hl-color', hlColor);
        }
        
        document.getElementById('bg-color').addEventListener('input', (e) => { 
            appData.bgColor = e.target.value; 
            appContainer.style.backgroundColor = appData.bgColor; 
            document.documentElement.style.setProperty('--bg-color-val', appData.bgColor);
            save(); 
        });
        document.getElementById('search-color').addEventListener('input', (e) => { 
            appData.searchHighlightColor = e.target.value; 
            document.documentElement.style.setProperty('--hl-color', appData.searchHighlightColor);
            save(); render(); updateSearchWindow(); updateFavoriteWindow(); 
        });
        
        const searchInput = document.getElementById('search-input');
        const searchClear = document.getElementById('search-clear');
        const searchWindow = document.getElementById('search-result-window');
        const searchContent = document.getElementById('search-result-content');
        const favoriteWindow = document.getElementById('favorite-window');
        const favoriteContent = document.getElementById('favorite-content');

        function updateSearchWindow() {
            searchWindow.className = `state-${searchWindowState}`;
            if (searchWindowState === 'hidden' || searchWindowState === 'collapsed') return;
            searchContent.innerHTML = '';
            if (searchQuery === '') return;

            let matches = appData.items.filter(item => {
                const plainText = stripHtml(item.content || '');
                const tagText = (item.tags || []).join(' '); 
                const titleText = item.title || '';
                return `${plainText} ${tagText} ${titleText}`.toLowerCase().includes(searchQuery);
            });

            matches.forEach(item => {
                let el = document.createElement('div'); el.className = `search-result-bubble type-${item.type}`;
                el.style.backgroundColor = hexToRgba(item.color, item.opacity); el.style.border = `3px solid ${item.borderColor || '#ffffff'}`;
                el.style.setProperty('--bg-color', hexToRgba(item.color, item.opacity)); el.style.setProperty('--border-color', item.borderColor || '#ffffff');
                if (item.isSearchMatch) {
                    el.classList.add('search-match'); el.style.setProperty('--search-color', appData.searchHighlightColor);
                    if (item.type !== 'group') el.style.boxShadow = `0 0 0 5px ${appData.searchHighlightColor}, 0 10px 30px rgba(0,0,0,0.4)`; 
                } else { if (item.type !== 'group') el.style.boxShadow = `0 10px 30px rgba(0,0,0,0.2)`; }

                const plainTextTitle = stripHtml(item.content || ''); const displayTitle = item.type === 'group' ? item.title : (plainTextTitle.split('\n')[0] || '새 메모');
                let clipHtml = (item.type === 'note' && item.content && item.content.includes('<img')) ? `<span class="clip-mark" style="opacity: 0.6;">📎</span>` : '';
                const tagLabel = (item.tags && item.tags.length > 0) ? '#' + item.tags.join(' #') : (item.type === 'group' ? '그룹' : '일반');
                const fColor = item.fontColor || '#333333';
                el.innerHTML = `<div class="bubble-title" style="color: ${fColor}">${displayTitle}${clipHtml}</div><div class="bubble-meta">${tagLabel}</div>`;
                el.onclick = (e) => { e.stopPropagation(); searchWindowState = 'collapsed'; updateSearchWindow(); activeItemId = item.id; currentParentId = item.parentId; item.lastModified = Date.now(); save(); render(); };
                searchContent.appendChild(el);
            });
        }

        function updateFavoriteWindow() {
            favoriteWindow.className = `state-${favoriteWindowState}`;
            if (favoriteWindowState === 'hidden' || favoriteWindowState === 'collapsed') return;
            favoriteContent.innerHTML = '';

            let favorites = appData.items.filter(item => item.isFavorite);

                el.style.backgroundColor = hexToRgba(item.color, item.opacity); el.style.border = `3px solid ${item.borderColor || '#ffffff'}`;
                el.style.setProperty('--bg-color', hexToRgba(item.color, item.opacity)); el.style.setProperty('--border-color', item.borderColor || '#ffffff');
                if (item.type !== 'group') el.style.boxShadow = `0 10px 30px rgba(0,0,0,0.2)`;

                const plainTextTitle = stripHtml(item.content || ''); const displayTitle = item.type === 'group' ? item.title : (plainTextTitle.split('\n')[0] || '새 메모');
                let clipHtml = (item.type === 'note' && item.content && item.content.includes('<img')) ? `<span class="clip-mark" style="opacity: 0.6;">📎</span>` : '';
                const tagLabel = (item.tags && item.tags.length > 0) ? '#' + item.tags.join(' #') : (item.type === 'group' ? '그룹' : '일반');
                const fColor = item.fontColor || '#333333';
                el.innerHTML = `<div class="bubble-title" style="color: ${fColor}">${displayTitle}${clipHtml}</div><div class="bubble-meta">${tagLabel}</div>`;
                
                el.onclick = (e) => { 
                    e.stopPropagation(); favoriteWindowState = 'collapsed'; updateFavoriteWindow(); 
                    activeItemId = item.id; currentParentId = item.parentId; item.lastModified = Date.now(); 
                    save(); render();

                favoriteContent.appendChild(el);

        searchInput.addEventListener('input', (e) => { 
            searchQuery = e.target.value.toLowerCase().trim();

                favoriteWindowState = 'collapsed';

            }
            updateSearchWindow(); 
            render(); 
        });
        searchInput.addEventListener('focus', () => { 
            if (searchQuery !== '') { 
                searchWindowState = 'expanded'; 
                favoriteWindowState = 'collapsed';
                updateFavoriteWindow();
                updateSearchWindow(); 
            }

        searchClear.addEventListener('click', (e) => { e.stopPropagation(); searchInput.value = ''; searchQuery = ''; searchClear.style.display = 'none'; searchWindowState = 'hidden'; updateSearchWindow(); render(); });
        
        document.addEventListener('mousedown', (e) => { 
            if (searchWindowState === 'expanded' && !e.target.closest('.search-wrapper') && !e.target.closest('#search-result-window')) { searchWindowState = 'collapsed'; updateSearchWindow(); }

        const imgResizer = document.getElementById('image-resizer-overlay');
