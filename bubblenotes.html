        function calculateLayout() {
            let activeGroup = null;
            if (activeItemId) {
                let actItem = appData.items.find(i => i.id === activeItemId);
                activeGroup = (actItem && actItem.type === 'group') ? activeItemId : currentParentId;
            } else {
                activeGroup = currentParentId;
            }
            let isGroupActive = activeGroup !== null;

            let renderItems = appData.items.filter(item => {
                if (!isGroupActive) return item.parentId === null;
                return item.id === activeGroup || item.parentId === activeGroup || item.parentId === null;
            });
            if (renderItems.length === 0) return [];

            renderItems.forEach(item => {
                item.isSearchMatch = false;
                if (searchQuery !== '') {
                    const plainText = stripHtml(item.content || '');
                    const tagText = (item.tags || []).join(' ');
                    const text = `${plainText} ${tagText} ${item.title || ''}`.toLowerCase();
                    if (text.includes(searchQuery)) item.isSearchMatch = true;
                }
            });

            let siblings = renderItems.filter(i => i.parentId === activeGroup);
            siblings.sort((a, b) => a.order - b.order);
            let centerItem = siblings[0] || renderItems.find(i => i.id === activeItemId);

            const screenW = appContainer.clientWidth || window.innerWidth;
            const screenH = appContainer.clientHeight || window.innerHeight;
            const isMobile = isMobileEnv();

            // 트리의 오른쪽 끝단(left: 30px + width: 280px = 310px) + 여백 20px = 330px
            const treeRightEdge = 330;
            const groupEditorCenterX = treeRightEdge + 550 / 2; // 605px (좌측 끝단 = 330px)
            const noteEditorCenterX = treeRightEdge + 750 / 2;  // 705px (좌측 끝단 = 330px)
            const groupEditorCenterY = 165;

            const centerX = isMobile
                ? screenW * 0.5
                : (isGroupActive ? groupEditorCenterX : Math.max(groupEditorCenterX, (screenW + treeRightEdge) * 0.5));
            const centerY = isMobile
                ? (isGroupActive ? screenH * 0.64 : screenH * 0.5)
                : (isGroupActive ? Math.max(380, screenH * 0.55) : screenH * 0.5);

            renderItems.forEach(item => {
                if (item.id === activeItemId) {
                    if (item.type === 'group') {
                        item.targetX = isMobile ? screenW * 0.5 : groupEditorCenterX;
                        item.targetY = isMobile ? 165 : groupEditorCenterY;
                    } else if (item.type === 'note') {
                        item.targetX = isMobile ? screenW * 0.5 : noteEditorCenterX;
                        item.targetY = screenH * 0.5;
                    }
                } else if (item === centerItem && searchQuery === '') {
                    item.targetX = centerX;
                    item.targetY = centerY;
                } else {
                    if (typeof item.targetX !== 'number' || isNaN(item.targetX) || typeof item.targetY !== 'number' || isNaN(item.targetY)) {
                        item.targetX = centerX + (Math.random() - 0.5) * 50;
                        item.targetY = centerY + (Math.random() - 0.5) * 50;
                    }
                }
            });

            const radius = isMobile ? 48 : 60;
            const groupPushDist = isMobile ? 220 : 380;

            for (let step = 0; step < 50; step++) {
                for (let i = 0; i < renderItems.length; i++) {
                    for (let j = i + 1; j < renderItems.length; j++) {
                        let a = renderItems[i], b = renderItems[j];
                        let aRadius = (a.id === activeItemId) ? (a.type === 'group' ? 110 : 300) : radius;
                        let bRadius = (b.id === activeItemId) ? (b.type === 'group' ? 110 : 300) : radius;
                        let dx = b.targetX - a.targetX;
                        let dy = b.targetY - a.targetY;
                        if (Math.abs(dx) < 0.1 && Math.abs(dy) < 0.1) { dx = (Math.random() - 0.5) * 20; dy = (Math.random() - 0.5) * 20; }
                        let dist = Math.hypot(dx, dy);
                        let minDist = aRadius + bRadius + (isMobile ? 12 : 20);
                        if (dist < minDist) {
                            let overlap = minDist - dist;
                            let fx = (dx / dist) * overlap * 0.5;
                            let fy = (dy / dist) * overlap * 0.5;
                            let aFixed = (a.id === activeItemId) || (a === centerItem && searchQuery === '');
                            let bFixed = (b.id === activeItemId) || (b === centerItem && searchQuery === '');
                            if (!bFixed) { b.targetX += fx; b.targetY += fy; }
                            if (!aFixed) { a.targetX -= fx; a.targetY -= fy; }
                        }
                    }
                }
                renderItems.forEach(item => {
                    if (item.id === activeItemId) return;

                    let isMember = item.parentId === activeGroup || item.id === activeGroup;
                    if (!(item === centerItem && searchQuery === '')) {
                        if (isGroupActive && !isMember) {
                            let dxC = item.targetX - centerX;
                            let dyC = item.targetY - centerY;
                            let distC = Math.hypot(dxC, dyC) || 1;
                            if (distC < groupPushDist) {
                                item.targetX += (dxC / distC) * 5;
                                item.targetY += (dyC / distC) * 5;
                            } else {
                                item.targetX -= (dxC / distC) * 0.5;
                                item.targetY -= (dyC / distC) * 0.5;
                            }
                        } else {
                            item.targetX += (centerX - item.targetX) * 0.05;
                            item.targetY += (centerY - item.targetY) * 0.05;
                        }
                    }

                    if (isMobile) {
                        const padX = 54;
                        const minY = isGroupActive ? 270 : 85;
                        const maxY = screenH - 90;
                        item.targetX = Math.max(padX, Math.min(screenW - padX, item.targetX));
                        item.targetY = Math.max(minY, Math.min(maxY, item.targetY));
                    } else {
                        const minBubbleX = treeRightEdge + radius + 5;
                        if (item.targetX < minBubbleX) item.targetX = minBubbleX;

                        if (isGroupActive && activeItemId === activeGroup && isMember) {
                            const minBubbleY = groupEditorCenterY + 155;
                            if (item.targetY < minBubbleY) item.targetY = minBubbleY;
                        }
                    }
                });
            }
            window.__activeGroupCenter = { x: centerX, y: centerY, id: activeGroup };
            return renderItems;
        }

        function isDescendant(parentId, childId) {
            if (parentId === childId) return true;
            let child = appData.items.find(i => i.id === childId);
            while (child && child.parentId) { if (child.parentId === parentId) return true; child = appData.items.find(i => i.id === child.parentId); }
            return false;
        }

        function renderTags(el, item) {
            let chipsContainer = el.querySelector('.chips-container');
            if (chipsContainer) {
                let chipsHtml = (item.tags || []).map((t, i) => `<span class="tag-chip">${t} <span class="tag-chip-del" data-idx="${i}">x</span></span>`).join('');
                chipsContainer.innerHTML = chipsHtml;
                chipsContainer.querySelectorAll('.tag-chip-del').forEach(btn => {
                    btn.addEventListener('click', e => {
                        e.stopPropagation(); let idx = parseInt(e.target.dataset.idx);
                        item.tags.splice(idx, 1); save(); renderTags(el, item); renderTree(); updateSearchWindow(); updateFavoriteWindow();
                    });
                });
            }
        }

        function render() {
            imgResizer.style.display = 'none'; resizingImg = null;
            let renderItems = calculateLayout() || []; let renderIds = renderItems.map(i => i.id);
            let currentNodes = Array.from(container.children);
            let isGroupActive = window.__activeGroupCenter && window.__activeGroupCenter.id !== null;

            currentNodes.forEach(el => {
                if (!renderIds.includes(el.dataset.id) && !el.classList.contains('animating-out')) {
                    el.classList.add('animating-out');
                    let item = appData.items.find(i => i.id === el.dataset.id);
                    if (item && item.parentId) {
                        let parent = appData.items.find(p => p.id === item.parentId);
                        if (parent && parent.targetX) { el.style.left = `${parent.targetX}px`; el.style.top = `${parent.targetY}px`; }
                    }
                    setTimeout(() => el.remove(), 500); 
                }
            });

            renderItems.forEach(item => {
                let el = container.querySelector(`[data-id="${item.id}"]`);
                const isEditor = item.id === activeItemId;
                let isNew = false;

                if (!el) {
                    isNew = true; el = document.createElement('div'); el.dataset.id = item.id; el.className = `item-node animating-in type-${item.type}`;
                    if (item.parentId) { let parent = appData.items.find(p => p.id === item.parentId); if (parent && parent.targetX) { el.style.left = `${parent.targetX}px`; el.style.top = `${parent.targetY}px`; }
                    } else { el.style.left = `${appContainer.clientWidth/2}px`; el.style.top = `${appContainer.clientHeight/2}px`; }
                    container.appendChild(el);

                    el.addEventListener('click', (e) => { if (activeItemId !== item.id) { e.stopPropagation(); activeItemId = item.id; if (item.parentId) currentParentId = item.parentId; item.lastModified = Date.now(); save(); render(); } });
                    
                    el.addEventListener('dragstart', e => { 
                        if (el.dataset.state === 'editor' && !e.target.closest('.editor-drag-handle')) { e.preventDefault(); return; }
                        e.dataTransfer.setData('text/plain', item.id);
                        
                        let dragIcon = document.createElement('div'); dragIcon.style.width = item.type === 'group' ? '132px' : '120px'; dragIcon.style.height = item.type === 'group' ? '132px' : '120px'; dragIcon.style.background = hexToRgba(item.color, item.opacity); dragIcon.style.position = 'absolute'; dragIcon.style.top = '-1000px';
                        if (item.type === 'group') { dragIcon.style.clipPath = 'polygon(29.3% 0%, 70.7% 0%, 100% 29.3%, 100% 70.7%, 70.7% 100%, 29.3% 100%, 0% 70.7%, 0% 29.3%)'; } 
                        else { dragIcon.style.borderRadius = '50%'; dragIcon.style.border = `3px solid ${item.borderColor || '#ffffff'}`; }
                        
                        document.body.appendChild(dragIcon); e.dataTransfer.setDragImage(dragIcon, 60, 60); setTimeout(() => dragIcon.remove(), 0); 
                        window.__dragStartX = e.clientX; window.__dragStartY = e.clientY; window.__draggedItem = item; window.__dragHandled = false; window.__isDetaching = false; window.__isAttaching = false; window.__dragSource = 'canvas'; 
                        window.__dragMode = 'group'; 
                    });
                    
                    el.addEventListener('drag', e => { 
                        if (e.clientX === 0 && e.clientY === 0) return;
                        processDragMove(e.clientX, e.clientY, item);
                    });

                    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drag-over'); });
                    el.addEventListener('dragleave', e => { el.classList.remove('drag-over'); });
                    el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('drag-over'); window.__dragHandled = true; handleDrop(e.dataTransfer.getData('text/plain'), item.id); });
                    el.addEventListener('dragend', e => { processDragEnd(); });

                    el.addEventListener('touchstart', e => {
                        if (el.dataset.state === 'editor' && !e.target.closest('.editor-drag-handle')) return;
                        const touch = e.touches[0];
                        window.__dragStartX = touch.clientX; window.__dragStartY = touch.clientY; window.__draggedItem = item; window.__dragHandled = false; window.__isDetaching = false; window.__isAttaching = false; window.__dragSource = 'canvas';
                    }, {passive: false});

                    el.addEventListener('touchmove', e => {
                        if (!window.__draggedItem || window.__draggedItem.id !== item.id) return;
                        if (el.dataset.state !== 'editor' || e.target.closest('.editor-drag-handle')) { e.preventDefault(); }
                        const touch = e.touches[0];
                        let dist = Math.hypot(touch.clientX - window.__dragStartX, touch.clientY - window.__dragStartY);
                        if (dist > 10 && el.dataset.state !== 'editor') {
                            const rect = appContainer.getBoundingClientRect();
                            el.style.transition = 'none';
                            el.style.zIndex = 3000;
                            el.style.left = (touch.clientX - rect.left) + 'px';
                            el.style.top = (touch.clientY - rect.top) + 'px';
                        }
                        processDragMove(touch.clientX, touch.clientY, item);
                    }, {passive: false});

                    el.addEventListener('touchend', e => {
                        if (!window.__draggedItem || window.__draggedItem.id !== item.id) return;
                        const touch = e.changedTouches[0];
                        el.style.transition = '';
                        el.style.zIndex = '';
                        document.getElementById('detach-tooltip').style.display = 'none'; document.getElementById('attach-tooltip').style.display = 'none';
                        el.style.pointerEvents = 'none';
                        let dropTargetEl = document.elementFromPoint(touch.clientX, touch.clientY);
                        el.style.pointerEvents = '';
                        let dropTargetNode = dropTargetEl ? dropTargetEl.closest('.item-node') : null;
                        
                        if (dropTargetNode && dropTargetNode.dataset.id !== item.id) { handleDrop(item.id, dropTargetNode.dataset.id); } 
                        else { processDragEnd(); render(); }
                    });
                }

                function processDragMove(clientX, clientY, dragItem) {
                    let distFromOrigin = Math.hypot(clientX - window.__dragStartX, clientY - window.__dragStartY);
                    if (distFromOrigin < 50) { document.getElementById('detach-tooltip').style.display = 'none'; document.getElementById('attach-tooltip').style.display = 'none'; window.__isDetaching = false; window.__isAttaching = false; return; }

                    if (dragItem.parentId !== null && window.__dragStartX) {
                        let dTooltip = document.getElementById('detach-tooltip');
                        if (distFromOrigin > 150) { dTooltip.style.display = 'block'; dTooltip.style.left = clientX + 'px'; dTooltip.style.top = clientY + 'px'; window.__isDetaching = true; 
                        } else { dTooltip.style.display = 'none'; window.__isDetaching = false; }
                    }
                    
                    let isGrpAct = window.__activeGroupCenter && window.__activeGroupCenter.id !== null;
                    if (isGrpAct && dragItem.parentId !== window.__activeGroupCenter.id && dragItem.id !== window.__activeGroupCenter.id) {
                        let distToCenter = Math.hypot(clientX - window.__activeGroupCenter.x, clientY - window.__activeGroupCenter.y);
                        let aTooltip = document.getElementById('attach-tooltip');
                        if (distToCenter < 250) { aTooltip.style.display = 'block'; aTooltip.style.left = clientX + 'px'; aTooltip.style.top = clientY + 'px'; window.__isAttaching = true; document.getElementById('detach-tooltip').style.display = 'none'; window.__isDetaching = false;
                        } else { aTooltip.style.display = 'none'; window.__isAttaching = false; }
                    }
                }

                function processDragEnd() {
                    document.getElementById('detach-tooltip').style.display = 'none'; document.getElementById('attach-tooltip').style.display = 'none';
                    if (window.__isDetaching && !window.__dragHandled) { window.__draggedItem.parentId = null; window.__draggedItem.lastModified = Date.now(); save(); render(); updateSearchWindow(); updateFavoriteWindow();
                    } else if (window.__isAttaching && !window.__dragHandled) { window.__draggedItem.parentId = window.__activeGroupCenter.id; window.__draggedItem.lastModified = Date.now(); save(); render(); updateSearchWindow(); updateFavoriteWindow(); }
                    window.__isDetaching = false; window.__isAttaching = false; window.__dragStartX = null; window.__draggedItem = null; window.__dragSource = null;
                }

                const currentState = isEditor ? 'editor' : 'bubble';
                el.className = `item-node ${currentState} type-${item.type}`;
                
                let isMember = item.parentId === window.__activeGroupCenter?.id || item.id === window.__activeGroupCenter?.id;
                if (isGroupActive && !isMember && !isEditor) { el.classList.add('semi-transparent'); } else { el.classList.remove('semi-transparent'); }

                el.style.backgroundColor = hexToRgba(item.color, item.opacity);
                el.style.border = `3px solid ${item.borderColor || '#ffffff'}`;
                el.style.setProperty('--bg-color', hexToRgba(item.color, item.opacity)); el.style.setProperty('--border-color', item.borderColor || '#ffffff');
                
                if (searchQuery !== '' && item.isSearchMatch) { 
                    el.classList.add('search-match'); el.style.setProperty('--search-color', appData.searchHighlightColor);
                    if (item.type !== 'group') el.style.boxShadow = `0 0 0 5px ${appData.searchHighlightColor}, 0 10px 30px rgba(0,0,0,0.4)`; 
                } else { 
                    el.classList.remove('search-match');
                    if (item.type !== 'group') el.style.boxShadow = `0 10px 30px rgba(0,0,0,0.2)`; 
                }

                if (isNew) { el.getBoundingClientRect(); el.classList.remove('animating-in'); }
                el.style.left = `${item.targetX}px`; el.style.top = `${item.targetY}px`;

                const plainTextTitle = stripHtml(item.content || ''); const displayTitle = item.type === 'group' ? item.title : (plainTextTitle.split('\n')[0] || '새 메모');
                let clipHtml = (item.type === 'note' && item.content && item.content.includes('<img')) ? `<span class="clip-mark" style="opacity: 0.6;">📎</span>` : '';

                if (el.dataset.state !== currentState || isNew) {
                    el.dataset.state = currentState;
                    
                    if (!isEditor) {
                        el.draggable = true;
                        const tagLabel = (item.tags && item.tags.length > 0) ? '#' + item.tags.join(' #') : (item.type === 'group' ? '그룹' : '일반');
                        const fColor = item.fontColor || '#333333';
                        el.innerHTML = `<div class="bubble-title" style="color: ${fColor}">${displayTitle}${clipHtml}</div><div class="bubble-meta">${tagLabel}</div>`;
                    } else {
                        el.draggable = false;
                        el.innerHTML = `
                            <div class="editor-ui">
                                <div class="editor-drag-handle" draggable="true" title="상단을 드래그하여 이동/그룹화"><div class="drag-bar"></div></div>
                                <button class="btn-minimize" title="편집 완료 (창 접기)">✓</button>
                                <button class="btn-close" title="삭제">X</button>
                                <div class="editor-controls">
                                    <div class="tags-wrapper">
                                        <div class="chips-container"></div>
                                        <input type="text" class="tag-input" placeholder="태그 입력(Enter)">
                                    </div>
                                    ${item.type === 'note' ? 
                                        `<label class="img-upload-label" for="img-upload-${item.id}">📷 첨부</label>
                                         <input type="file" id="img-upload-${item.id}" style="display:none" accept="image/*">` : 
                                        `<input type="text" class="title-input" value="${item.title}" placeholder="그룹명">`
                                    }
                                    <div class="appearance-controls">
                                        바탕 <input type="color" class="color-picker item-color" value="${item.color}">
                                        부분글자 <input type="color" class="color-picker text-color-picker" value="#333333" title="드래그한 텍스트의 색상을 변경합니다">
                                        투명도 <input type="range" class="opacity-slider" min="0.1" max="1" step="0.1" value="${item.opacity}">
                                        <button class="btn-favorite inline-fav ${item.isFavorite ? 'active' : ''}" title="즐겨찾기 토글">${item.isFavorite ? '★' : '☆'}</button>
                                    </div>
                                    ${item.type === 'group' ? `<button class="btn-parent">상위 그룹 생성</button>` : ''}
                                </div>
                                <div class="editor-body">
                                    ${item.type === 'note' ? 
                                        `<div class="editor-textarea" contenteditable="true" placeholder="메모를 입력하세요...">${item.content || ''}</div>` : 
                                        ``
                                    }
                                </div>
                            </div>
                        `;

                        renderTags(el, item);
                        
                        let favBtn = el.querySelector('.btn-favorite');
                        if (favBtn) {
                            favBtn.addEventListener('click', (e) => {
                                e.stopPropagation();
                                item.isFavorite = !item.isFavorite;
                                if(item.isFavorite) {
                                    favBtn.classList.add('active');
                                    favBtn.textContent = '★';
                                } else {
                                    favBtn.classList.remove('active');
                                    favBtn.textContent = '☆';
                                }
                                save(); 
                                updateFavoriteWindow();
                            });
                        }

                        el.querySelector('.tag-input').addEventListener('keydown', e => {
                            if (e.isComposing || e.keyCode === 229) return; 
                            if (e.key === 'Enter') {
                                e.preventDefault(); let val = e.target.value.trim();
                                if (val !== '') { if (!item.tags.includes(val)) item.tags.push(val); e.target.value = ''; save(); renderTags(el, item); renderTree(); updateSearchWindow(); updateFavoriteWindow(); }
                            }
                        });

                        if (item.type === 'note') {
                            const textarea = el.querySelector('.editor-textarea');
                            textarea.addEventListener('input', e => { item.content = e.target.innerHTML; item.lastModified = Date.now(); save(); renderTree(); updateSearchWindow(); updateFavoriteWindow(); });
                            
                            let fileLabel = el.querySelector('.img-upload-label'); let fileInput = el.querySelector(`#img-upload-${item.id}`);
                            fileLabel.addEventListener('click', e => e.stopPropagation()); fileInput.addEventListener('click', e => e.stopPropagation());

                            fileInput.addEventListener('change', async (e) => {
                                let file = e.target.files[0];
                                if (file && dirHandle) {
                                    const ext = file.name.split('.').pop() || 'png';
                                    const filename = 'img_' + Date.now() + '.' + ext;
                                    
                                    try {
                                        const rawBuffer = await file.arrayBuffer();
                                        const encryptedBuffer = await CryptoUtil.encryptBinary(rawBuffer);

                                        const fileHandle = await dirHandle.getFileHandle(filename, { create: true });
                                        const writable = await fileHandle.createWritable();
                                        await writable.write(encryptedBuffer);
                                        await writable.close();
                                        
                                        const blobUrl = URL.createObjectURL(file);
                                        activeBlobUrls.push(blobUrl);
                                        let imgHtml = `<img src="${blobUrl}" data-filename="${filename}" style="width: 200px;" />`;
                                        
                                        textarea.focus(); let sel = window.getSelection();
                                        if (sel.rangeCount > 0) {
                                            let range = sel.getRangeAt(0);
                                            if (textarea.contains(range.commonAncestorContainer)) {
                                                let elNode = document.createElement('div'); elNode.innerHTML = imgHtml; let frag = document.createDocumentFragment(); let node, lastNode;
                                                while ((node = elNode.firstChild)) { lastNode = frag.appendChild(node); }
                                                range.insertNode(frag); if (lastNode) { range = range.cloneRange(); range.setStartAfter(lastNode); range.collapse(true); sel.removeAllRanges(); sel.addRange(range); }
                                            } else { textarea.insertAdjacentHTML('beforeend', '<br/>' + imgHtml); }
                                        } else { textarea.insertAdjacentHTML('beforeend', '<br/>' + imgHtml); }
                                        
                                        item.content = textarea.innerHTML; save(); render(); updateSearchWindow(); updateFavoriteWindow();
                                    } catch(err) { alert("이미지 저장 실패. 권한을 확인해주세요."); }
                                }
                            });
                        } else {
                            el.querySelector('.title-input').addEventListener('input', e => { item.title = e.target.value; item.lastModified = Date.now(); save(); renderTree(); updateSearchWindow(); updateFavoriteWindow(); });
                            if (el.querySelector('.btn-parent')) { el.querySelector('.btn-parent').addEventListener('click', (e) => { e.stopPropagation(); const newGroup = createItem('group', currentParentId); item.parentId = newGroup.id; activeItemId = newGroup.id; save(); render(); updateSearchWindow(); updateFavoriteWindow(); }); }
                        }

                        el.querySelector('.item-color').addEventListener('input', e => { 
                            let newColor = e.target.value; item.color = newColor; el.style.backgroundColor = hexToRgba(newColor, item.opacity); el.style.setProperty('--bg-color', hexToRgba(newColor, item.opacity));
                            if (item.type === 'group') {
                                const syncBgColor = (parentId, color) => {
                                    appData.items.filter(i => i.parentId === parentId).forEach(child => {
                                        child.color = color; let childEl = container.querySelector(`[data-id="${child.id}"]`);
                                        if(childEl) { childEl.style.backgroundColor = hexToRgba(color, child.opacity); childEl.style.setProperty('--bg-color', hexToRgba(color, child.opacity)); let picker = childEl.querySelector('.item-color'); if(picker) picker.value = color; }
                                        syncBgColor(child.id, color);
                                    });
                                };
                                syncBgColor(item.id, newColor);
                            }
                            save(); updateSearchWindow(); updateFavoriteWindow();
                        });

                        el.querySelector('.text-color-picker').addEventListener('input', e => { 
                            if (item.type === 'note' && savedSelectionRange) {
                                let sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(savedSelectionRange);
                                document.execCommand('styleWithCSS', false, true); document.execCommand('foreColor', false, e.target.value); 
                                item.content = el.querySelector('.editor-textarea').innerHTML; save(); renderTree(); updateSearchWindow(); updateFavoriteWindow();
                            }
                        });
                        el.querySelector('.opacity-slider').addEventListener('input', e => { item.opacity = parseFloat(e.target.value); el.style.backgroundColor = hexToRgba(item.color, item.opacity); el.style.setProperty('--bg-color', hexToRgba(item.color, item.opacity)); save(); });
                        
                        el.querySelector('.btn-minimize').addEventListener('click', (e) => {
                            e.stopPropagation(); activeItemId = null; save(); render();
                        });
                        el.querySelector('.btn-close').addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (!isMobileEnv() || confirm("이 항목을 삭제하시겠습니까?")) {
                                deleteItemAndChildren(item.id);
                            }
                        });
                    }
                } else if (!isEditor) {
                    const tagLabel = (item.tags && item.tags.length > 0) ? '#' + item.tags.join(' #') : (item.type === 'group' ? '그룹' : '일반');
                    el.querySelector('.bubble-title').innerHTML = displayTitle + clipHtml;
                    el.querySelector('.bubble-meta').textContent = tagLabel;
                }
            });

            backdrop.className = (activeItemId || currentParentId) ? 'active' : '';
            renderTree(); 
        }

        function createItem(type, parentId) {
            const newItem = { id: generateId(), type: type, content: '', tags: [], title: '새 그룹', color: '#ffffff', borderColor: '#ffffff', opacity: 1.0, parentId: parentId, lastModified: Date.now(), expanded: true, order: Date.now(), isFavorite: false };
            appData.items.push(newItem); return newItem;
        }

        function handleDrop(draggedId, targetId) {
            if(draggedId === targetId) return; if(isDescendant(draggedId, targetId)) return;
            let dragged = appData.items.find(i => i.id === draggedId); let target = appData.items.find(i => i.id === targetId);
            if (!dragged || !target) return;
            if (target.type === 'note' && dragged.type === 'note') {
                const newGroup = createItem('group', target.parentId);
                dragged.parentId = newGroup.id; target.parentId = newGroup.id; dragged.lastModified = Date.now(); target.lastModified = Date.now();
            } else if (target.type === 'group') {
                dragged.parentId = target.id; dragged.lastModified = Date.now(); target.lastModified = Date.now();
            }
            save(); render(); updateSearchWindow(); updateFavoriteWindow();
        }

        function handleReorderDrop(draggedId, targetId, position = 'before') {
            if (draggedId === targetId) return;
            let dragged = appData.items.find(i => i.id === draggedId);
            let target = appData.items.find(i => i.id === targetId);
            
            if (!dragged || !target || dragged.parentId !== target.parentId) return;
            
            let siblings = appData.items.filter(i => i.parentId === dragged.parentId).sort((a, b) => a.order - b.order);
            siblings = siblings.filter(i => i.id !== draggedId);
            let targetIndex = siblings.findIndex(i => i.id === targetId);
            
            if (targetIndex !== -1) {
                let insertIndex = (position === 'after') ? targetIndex + 1 : targetIndex;
                siblings.splice(insertIndex, 0, dragged);
            }
            
            siblings.forEach((item, index) => {
                item.order = index;
            });
            
            save(); renderTree(); render(); updateFavoriteWindow();
        }

        backdrop.addEventListener('click', () => {
            if (activeItemId !== null) { activeItemId = null; } 
            else if (currentParentId !== null) { let parentGroup = appData.items.find(i => i.id === currentParentId); currentParentId = parentGroup ? parentGroup.parentId : null; }
            save(); render(); if (isMobileEnv()) treeView.classList.remove('open');
        });

        document.getElementById('btn-add-note').addEventListener('click', () => {
            let parent = (activeItemId && appData.items.find(i=>i.id===activeItemId)?.type==='group') ? activeItemId : currentParentId;
            const item = createItem('note', parent); activeItemId = item.id; currentParentId = parent; save(); render();
        });

        document.getElementById('btn-add-group').addEventListener('click', () => {
            let parent = (activeItemId && appData.items.find(i=>i.id===activeItemId)?.type==='group') ? activeItemId : currentParentId;
            const item = createItem('group', parent); activeItemId = item.id; currentParentId = parent; save(); render();
        });

        window.addEventListener('resize', render);

        // 창 크기가 작을 때 입력 포커스로 인해 트리가 왼쪽 화면 밖으로 밀려나는 현상 원천 차단
        appContainer.addEventListener('scroll', () => {
            if (appContainer.scrollLeft !== 0) appContainer.scrollLeft = 0;
            if (appContainer.scrollTop !== 0) appContainer.scrollTop = 0;
        });
    </script>
</body>
</html>
